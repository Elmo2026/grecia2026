<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Fondo Negro */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* --- CONTENEDOR PARA LA IMAGEN-BOTÓN --- */
        #btnImagenClick {
            cursor: pointer; /* Mano al pasar el mouse */
            transition: transform 0.2s ease; 
            z-index: 100; /* Por encima del fondo */
            display: block;
        }

        #btnImagenClick img {
            max-width: 280px; /* Tamaño ideal para el botón de imagen */
            height: auto; 
            display: block;
            border-radius: 10px; /* Por si tu imagen tiene bordes rectos */
        }

        #btnImagenClick:hover {
            transform: scale(1.05); /* Efecto sutil al pasar el mouse */
        }

        #btnImagenClick:active {
            transform: scale(0.95); /* Efecto de hundido al hacer clic */
        }
        /* --------------------------------------------- */

        /* Contenedor de la Sorpresa */
        #sorpresa {
            display: none;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 50;
        }

        /* Texto de felicitación brillante */
        h1 {
            font-size: 4.5rem;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055;
            animation: bounce 2s infinite;
        }
        h2 {
            font-size: 2.8rem;
            color: #00f3ff;
            margin-top: 0;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Globos */
        .globo {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 75px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: flotar 6s linear infinite;
            z-index: 20;
        }
        .globo::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 26px;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 10px solid rgba(255,255,255,0.3);
        }
        .globo::before {
            content: "";
            position: absolute;
            bottom: -35px;
            left: 29px;
            width: 2px;
            height: 30px;
            background-color: rgba(255,255,255,0.4);
        }

        @keyframes flotar {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-120vh) translateX(70px) rotate(15deg); opacity: 0; }
        }

        /* Fuegos Artificiales */
        .particula {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
            animation: estallido 1.2s ease-out forwards;
        }

        @keyframes estallido {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0.2);
                opacity: 0;
            }
        }
    </style>
</head>

    <!-- Contenido de la Sorpresa -->
    <div id="sorpresa">
        <h1>¡FELIZ CUMPLEAÑOS!</h1>
        <h2>¡FELIZ 29! YA ESTÁS CUCHA</h2>
    </div>

    <script>
        const colores = ['#ff0055', '#00f3ff', '#00ff66', '#ff00ff', '#ffff00', '#ff9900', '#ff3333'];

        function mostrarSorpresa() {
            // Intentar reproducir la música (si el archivo no existe o falla, el código continuará sin trabarse)
            const musica = document.getElementById('cumpleano');
            if (musica) {
                musica.play().catch(error => console.log("Esperando interacción o error de archivo:", error));
            }

            // Ocultar la imagen de entrada por completo
            document.getElementById('btnImagenClick').style.display = 'none';
            
            // Mostrar texto de felicitación
            const sorpresa = document.getElementById('sorpresa');
            sorpresa.style.display = 'block';
            setTimeout(() => { sorpresa.style.opacity = '1'; }, 50);

            // Activar las animaciones infinitas
            setInterval(crearGlobo, 400);       
            setInterval(lanzarFuego, 800);     
            lanzarFuego(); 
        }

        function crearGlobo() {
            const globo = document.createElement('div');
            globo.classList.add('globo');
            globo.style.left = Math.random() * 100 + 'vw';
            
            const escala = Math.random() * 0.5 + 0.8; 
            globo.style.transform = `scale(${escala})`;

            const colorElegido = colores[Math.floor(Math.random() * colores.length)];
            globo.style.backgroundColor = colorElegido;
            globo.style.boxShadow = `inset -10px -10px 20px rgba(0,0,0,0.3), 0 0 15px ${colorElegido}`;
            
            const duracion = Math.random() * 3 + 4; 
            globo.style.animationDuration = duracion + 's';

            document.body.appendChild(globo);
            setTimeout(() => { globo.remove(); }, duracion * 1000);
        }

        function lanzarFuego() {
            const centroX = Math.random() * window.innerWidth;
            const centroY = Math.random() * (window.innerHeight * 0.7); 
            
            const colorFuego = colores[Math.floor(Math.random() * colores.length)];
            const cantidadParticulas = 40; 

            for (let i = 0; i < cantidadParticulas; i++) {
                const particula = document.createElement('div');
                particula.classList.add('particula');
                
                particula.style.left = centroX + 'px';
                particula.style.top = centroY + 'px';
                particula.style.backgroundColor = colorFuego;
                particula.style.boxShadow = `0 0 8px ${colorFuego}`;

                const angulo = Math.random() * Math.PI * 2;
                const distancia = Math.random() * 120 + 50; 
                const x = Math.cos(angulo) * distancia;
                
                // CORREGIDO: Se eliminó el Math.max() que rompía la ejecución
                const y = Math.sin(angulo) * distancia;

                particula.style.setProperty('--x', `${x}px`);
                particula.style.setProperty('--y', `${y}px`);

                document.body.appendChild(particula);
                setTimeout(() => { particula.remove(); }, 1200);
            }
        }
    </script>
